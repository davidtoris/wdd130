<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact us at Exciting Expeditions, a family-owned whitewater rafting business passionate about sharing outdoor adventures for over 20 years.">
  <title>Web Page Contact Us</title>
  <meta name="David Toris">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>
    <!-- <div id="logo">Wasatch Accusystems</div> -->
    <img src="images/logo.jpg" alt="Logo">
    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-info">
      <h1>Rafting Company</h1>
      <div>Los ameales 123</div>
      <div>CDMX, Mexico</div>
      <div>+52 999 999 9999</div>
      <div>contact@rafting.com</div>
    </section>

    <section class="contact-content">
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3765.536289062507!2d-99.24129652422194!3d19.302521544821168!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cdff0914e6044d%3A0xddd3afdfbf3b0770!2sDeportivo%201%C2%BA%20de%20Mayo!5e0!3m2!1ses-419!2smx!4v1771047631026!5m2!1ses-419!2smx"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <form class="contact-form">
        <div class="form-group inline">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Placeholder">
        </div>
        <div class="form-group inline">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Placeholder">
        </div>
        <div class="form-group radio-group inline">
          <label>Message Purpose</label>
          <div class="radios">
            <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
            <label><input type="radio" name="purpose" value="reservation"> Reservation
              Question</label>
            <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
          </div>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Type here"></textarea>
        </div>
        <div class="form-group check-group">
          <label><input type="checkbox" name="newsletter"> Please Subscribe me to the monthly
            newsletter</label>
        </div>
        <button type="submit">Get in Touch!</button>
      </form>
    </section>

    <section class="employee-profiles">
      <h2>We Are Here to Serve You</h2>
      <div class="profiles-container">
        <div class="profile-card">
          <img src="images/rafting19_600.jpg" alt="Employee Profile">
          <p>Employee Profile</p>
        </div>
        <div class="profile-card">
          <img src="images/rafting19_600.jpg" alt="Employee Profile">
          <p>Employee Profile</p>
        </div>
        <div class="profile-card">
          <img src="images/rafting19_600.jpg" alt="Employee Profile">
          <p>Employee Profile</p>
        </div>
      </div>
    </section>
  </main>


  <footer>
    <p>&copy; 2026 White Water Rafting - Exciting Expeditions - David Toris</p>
    <nav class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon" width="30"
          height="30"></a>
      <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon" width="30"
          height="30"></a>
      <a href="https://instagram.com"><img src="images/instagram.jpg" alt="Instagram Icon"
          width="30" height="30"></a>
    </nav>
  </footer>
</body>

</html>
